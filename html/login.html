<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/style-header.css">
    <title>login</title>
</head>

<body>
    <header class="header">
        <div class="div-header">
                 <ul class="home-items" id="box">
                <li><a class="link-header" id="img-home" href="home.html"><img src="../icon/icons8_home_500px_1.png" alt=""></a> </li>

               
            </ul>
            <h1 id="store"> PW</h1>
        </div>
    </header>
     

    
    <div class="login-container">
        <form class="login-form">
            <h2>login</h2>
            <div class="error-message" id="error-message">Invalid username or password. Please try again.</div>
            <img class="icon" src="../icon/icons8_contacts_500px.png" alt="">
            <input type="text" id="username" name="username" value="" placeholder="username" required>
            <img class="icon" src="../icon/icons8_key_480px_1.png" alt="">
            <input type="password" id="password" name="password" placeholder="password" required>
            <input id="submit" type="submit" value="login">
        </form>

    </div>
    
  
    <script src="../js/login.js"></script>
   


</body>

</html>
